<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ISLAMCRAFT - Jeu éducatif multijoueur"
    >

    <title>ISLAMCRAFT</title>

    <link
        rel="stylesheet"
        href="./styles/main.css"
    >

    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <div id="game-container"></div>

    <div
        id="loading-screen"
        aria-live="polite"
    >
        <div class="loading-content">

            <h1>ISLAMCRAFT</h1>

            <p id="loading-message">
                Chargement...
            </p>

            <div
                id="loading-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            ></div>

        </div>
    </div>

    <noscript>
        <p>
            JavaScript est nécessaire pour jouer à ISLAMCRAFT.
        </p>
    </noscript>

    <script
        type="module"
        src="./main.js"
    ></script>

</body>
</html>
